# TEMPLATE 02 — Configuration
# Where it goes: src/main/resources/application.properties   (you already have one)
#
# Spring Boot reads this file on startup. Every setting has a sensible default, so you only write
# the ones you want to change. Full list of built-in keys:
# https://docs.spring.io/spring-boot/appendix/application-properties/index.html

spring.application.name=telemetrix-backend

# ─── Placeholders: ${ENV_VAR:default} ───────────────────────────────────────────────────────────
# "Use environment variable SPRING_DATASOURCE_URL if it is set, otherwise the default."
# Locally the default is used; in Docker/production you set the env var. Same jar, different
# config — never hard-code passwords for real environments.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/telemetrix}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:telemetrix}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:telemetrix}
# (Actually any property can be overridden by an env var without a placeholder: Spring maps
#  SPRING_DATASOURCE_URL → spring.datasource.url automatically. The placeholder just documents it.)

# ─── JPA / Hibernate ────────────────────────────────────────────────────────────────────────────
# validate = check entities against the tables at startup; never create/alter tables.
# (Flyway owns the schema — template 03. Other values: none, create, create-drop, update.)
spring.jpa.hibernate.ddl-auto=validate
# Don't keep the DB session open while rendering the HTTP response (avoids hidden lazy queries).
spring.jpa.open-in-view=false
# Print the SQL Hibernate runs — handy while learning, noisy otherwise.
#spring.jpa.show-sql=true

# ─── Web ────────────────────────────────────────────────────────────────────────────────────────
#server.port=8080
# Errors as standard JSON (RFC 9457 "problem details") instead of an HTML error page.
spring.mvc.problemdetails.enabled=true
# Returned Page<…> objects become {"content":[…], "page":{…}} — a stable JSON shape (template 08).
spring.data.web.pageable.serialization-mode=via-dto

# ─── Logging ────────────────────────────────────────────────────────────────────────────────────
# Levels: TRACE < DEBUG < INFO (default) < WARN < ERROR. Set per package:
#logging.level.com.telemetrix=DEBUG
#logging.level.org.hibernate.SQL=DEBUG

# ─── Your own settings ──────────────────────────────────────────────────────────────────────────
# Any key you invent can be read by your code. Group them under a prefix and bind them to a
# record with @ConfigurationProperties — template 10.
openf1.base-url=${OPENF1_BASE_URL:https://api.openf1.org/v1}
openf1.timeout=10s

# ─── Profiles ───────────────────────────────────────────────────────────────────────────────────
# A profile is a named set of overrides. Create application-dev.properties next to this file and
# start with SPRING_PROFILES_ACTIVE=dev (or --spring.profiles.active=dev). Keys in the profile
# file win over the ones here.
