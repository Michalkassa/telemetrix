spring.application.name=telemetrix-backend

# --- Database ---
# ${NAME:default} = use environment variable NAME if set, otherwise the default.
# The defaults match docker-compose.yml, so locally nothing needs to be set.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/telemetrix}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:telemetrix}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:telemetrix}

# Flyway creates and changes the schema (src/main/resources/db/migration).
# Hibernate must never change it — it only checks that our entities match the tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Web ---
# Errors come back as standard JSON "problem details" (RFC 9457) instead of an HTML page.
spring.mvc.problemdetails.enabled=true

# --- Imports ---
# Spring Batch must not run jobs at startup; imports are started on purpose (admin endpoints).
spring.batch.job.enabled=false

# --- Actuator ---
# Only health over HTTP (Docker Compose's healthcheck); it includes the database.
management.endpoints.web.exposure.include=health
