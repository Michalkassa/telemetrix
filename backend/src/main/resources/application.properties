spring.application.name=telemetrix-backend

# --- Database ---
# ${NAME:default} = use environment variable NAME if set, otherwise the default.
# The defaults match docker-compose.yml, so locally nothing needs to be set.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/telemetrix}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:telemetrix}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:telemetrix}

# Flyway creates and changes the schema (src/main/resources/db/migration).
# Hibernate must never change it — it only checks that our entities match the tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Web ---
# Errors come back as standard JSON "problem details" (RFC 9457) instead of an HTML page.
spring.mvc.problemdetails.enabled=true

# --- Imports ---
# Spring Batch must not run jobs at startup; imports are started on purpose (admin endpoints).
spring.batch.job.enabled=false

# --- Actuator ---
# Only health over HTTP (Docker Compose's healthcheck); it includes the database.
management.endpoints.web.exposure.include=health

# --- Security (docs/adr/0007) ---
# Behind the nginx in Docker: the client's address and scheme from X-Forwarded-* (only from private-network
# proxies), for rate limiting by address and GitHub's callback URL.
server.forward-headers-strategy=native
# Sign in with GitHub: an OAuth app at https://github.com/settings/developers whose callback is
# <backend>/login/oauth2/code/github. Without these, the API still works; only sign-in doesn't.
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.github.scope=read:user
# GitHub logins (comma-separated) that are ADMIN / ANALYST; everyone else who signs in is a USER.
telemetrix.security.admins=${TELEMETRIX_ADMINS:}
telemetrix.security.analysts=${TELEMETRIX_ANALYSTS:}
# Where the browser lands after signing in (the tokens in the URL fragment).
telemetrix.security.login-redirect=${TELEMETRIX_LOGIN_REDIRECT:http://localhost:5173/auth/callback}
# The JWT signing key: telemetrix.security.jwt.public-key / private-key as PEM files (env
# TELEMETRIX_SECURITY_JWT_PUBLICKEY=file:/run/secrets/jwt-public.pem, ..._PRIVATEKEY). Unset: a new key at
# each start, so tokens don't survive a restart.
