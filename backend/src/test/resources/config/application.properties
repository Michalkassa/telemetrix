# Test-only settings, on top of src/main/resources/application.properties (Spring Boot reads
# classpath:/config/application.properties after it, so these win).

# The test classes share Spring contexts and all come from one address: limits high enough never to
# trip by accident. RateLimitTest sets its own low ones.
telemetrix.security.rate-limit.anonymous-per-minute=1000000
telemetrix.security.rate-limit.authenticated-per-minute=1000000

# GitHub logins the tests sign in as (AuthorizationMatrixTest and friends)
telemetrix.security.admins=test-admin
telemetrix.security.analysts=test-analyst

# API keys the tests call with (ApiKeyTest): only their SHA-256 is configured
# test-admin-key-0123456789
telemetrix.security.api-keys[0].name=ci
telemetrix.security.api-keys[0].sha256=82007d29a6e0686708f2ef128b4d5d2225286cb76e82f74b09324d61ec36f968
telemetrix.security.api-keys[0].role=ADMIN
# test-analyst-key-0123456789
telemetrix.security.api-keys[1].name=notebook
telemetrix.security.api-keys[1].sha256=8412faef13fa9a6774c9dbffd0c4c83e10a0f0d416d3ec266d104157036e0cbf
telemetrix.security.api-keys[1].role=ANALYST
