# Local infrastructure for Telemetrix. Start with:  docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: telemetrix
      POSTGRES_USER: telemetrix
      POSTGRES_PASSWORD: telemetrix
    ports:
      - "5432:5432"            # host:container — lets the backend on your machine connect
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetrix -d telemetrix"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
