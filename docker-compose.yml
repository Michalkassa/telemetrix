# The whole Telemetrix stack (plan.md → DevOps). One command:
#
#   docker compose up --build -d --wait     then open http://localhost:3000
#
# For development, run only the database here (docker compose up -d postgres) and the backend and
# frontend on your machine (./mvnw spring-boot:run, npm run dev).
#
# Settings come from .env (copy .env.example); every one has a default, so .env is optional.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telemetrix}
      POSTGRES_USER: ${POSTGRES_USER:-telemetrix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telemetrix}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"   # host:container — lets a backend on your machine connect
    volumes:
      - pgdata:/var/lib/postgresql/data  # data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      # on the compose network the database is postgres:5432, not localhost
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-telemetrix}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-telemetrix}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-telemetrix}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # the JRE image has no curl: a plain HTTP request with bash
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 12
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-off: imports the season calendars in SEED_SEASONS so there are races to pick (safe to
  # repeat). A race's laps are downloaded when it's first opened in the app.
  seed:
    image: curlimages/curl:8.16.0
    depends_on:
      backend:
        condition: service_healthy
    environment:
      SEED_SEASONS: ${SEED_SEASONS:-2024}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for year in $$SEED_SEASONS; do
          echo "importing the $$year calendar..."
          curl -fsS --retry 3 --retry-all-errors -X POST http://backend:8080/api/admin/import/seasons/$$year -o /dev/null || exit 1
        done
        echo done
    restart: "no"

  # Later phases add timescaledb, redis, kafka and elasticsearch (docs/adr/0002):
  # redis:
  #   image: redis:7
  # kafka:
  #   image: apache/kafka:3.9.0
  # elasticsearch:
  #   image: elasticsearch:8.15.0

volumes:
  pgdata:
