# The single-page app, and the API behind it on the same origin (no CORS).
server {
    listen 80;
    root /usr/share/nginx/html;

    # the API: forwarded to the backend service on the compose network
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s; # a race's first import can take a while
    }

    # hashed file names: safe to cache for good
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # every other path is a page of the app (deep links like /races/2024/1/replay)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
}
